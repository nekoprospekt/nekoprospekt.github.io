<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>links</title>
<link rel="icon" href="images/censor.gif" type="image/gif">

<style>

@font-face {
  font-family: DIN;
  src: url(Fonts/DIN\ 1451\ Mittelschrift\ Regular.ttf);
}

body{
    margin:0;
    font-family: DIN, sans-serif;
    background:#111;
    color:rgb(255, 255, 255);
    overflow:hidden;
}

a{
    text-decoration: none;
    color: white;
    transition: filter 0.25s ease;
}

a:hover{
    filter: blur(5px);
}

.page{
    display:flex;
    height:100vh;
    width:100%;
}

.line-block{
    position:absolute;
    bottom:60px;
    left:40px;
    width:100%;
}

.left{
    width:40%;
    display:flex;
    align-items:flex-end;
    padding-left:100px;
    gap:40px;

    padding-bottom:120px;
    position: relative;
}

.vertical{
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    font-size:120px;
    line-height:0.74;
    letter-spacing: 5px;
}

.subtext{
    font-family: Bahnschrift Thin;
    margin-top:8px;
    font-size:16px;
    letter-spacing:2px;
    opacity: 48%;
    font-weight:300;
}

.img{
    z-index: 1;

}

.bottom-line{
    height:8px;
    background:rgba(255, 255, 255, 0.178);
    opacity:1;
}

.right{
    width:60%;
    display:flex;
    justify-content:center;
    align-items:center;
}

.right img{
    max-width:90%;
    max-height:85vh;
    object-fit:cover;
    filter: grayscale(100%);
    transition:0.4s ease;
}

.right img:hover{
    filter: grayscale(0%);
}

.giant-char{
    position: fixed;
    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%) rotate(190deg);
    writing-mode: vertical-rl;

    font-size: 600px; 
    font-weight: bold;

    color: white;
    opacity: 0.035;

    pointer-events: none;
    user-select: none;

    z-index: 1;  
}

.unicode-bg{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:300vh;

    z-index:0;

    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(95px, 1fr));
    grid-auto-rows:95px;

    font-size:35px;
    color:#272727;
    pointer-events:none;
    user-select:none;

    animation:drift 180s linear infinite;
}

.unicode-bg span{
    opacity:0.09;
    transition:opacity 0.09s;
}

@keyframes drift{
    from{ transform:translateY(0); }
    to{ transform:translateY(-90px); }
}

</style>
</head>

<body>
<div class="unicode-bg"></div>
<div class="page">

    <div class="left">
        <div class="vertical"><a href="https://discordid.netlify.app/?id=956267969741217813">Discord</a></div>
        <div class="vertical"><a href="https://community.lambdageneration.com/user/lilly">LambdaGen</a></div>
        <div class="vertical"><a href="https://www.tiktok.com/@nekoprospekt">Tiktok</a></div>
        <div class="vertical"><a href="https://steamcommunity.com/id/universal-union">Steam</a></div>
        <div class="vertical"><a href="https://forum.4played.de/memberlist.php?mode=viewprofile&un=neko*prospekt">4played.de</a></div>
        <div class="vertical"><a href="https://github.com/nekoprospekt">Github</a></div>
        <div class="giant-char">*@#</div>
        <div class="vertical"></div>

        <div class="line-block">
        <div class="bottom-line"></div>
        <div class="subtext">Send me a DM before you add me. I'll not accept friend requests from people I don't know!</div>
        </div>
    </div>

    <div class="right">
        <img src="images/frame.png">
    </div>

</div>

<script>

const header = document.querySelector(".header-content")
const bg = document.querySelector(".header-bg")

window.addEventListener("scroll", () => {
    let scroll = window.scrollY
    let fade = 1 - scroll / 400
    if (fade < 0) fade = 0
    header.style.opacity = fade
    let textBlur = scroll / 40
    header.style.filter = "blur(" + textBlur + "px)"
    bg.style.transform = "translateY(" + scroll * 0.4 + "px)"
    let bgBlur = scroll / 120
    bg.style.filter = "blur(" + bgBlur + "px)"
})

const sections = document.querySelectorAll(".section")

const sectionObserver = new IntersectionObserver(entries => {
    entries.forEach(entry => {
        if(entry.isIntersecting){
            entry.target.classList.add("visible")
            sectionObserver.unobserve(entry.target)
        }
    })
},{threshold:0.35})

sections.forEach((sec, i)=>{
    const tiltAngle = (i % 2 === 0 ? 4 : -4)
    sec.style.setProperty("--initial-tilt", tiltAngle + "deg")
    sectionObserver.observe(sec)
})

</script>
<script>

const chars = [
"╳","╲","╱","␦","?"
];

const grid = document.querySelector(".unicode-bg");

function buildGrid(){

    const size = 100;
    const cols = Math.ceil(window.innerWidth / size);
    const rows = Math.ceil((window.innerHeight * 3) / size);

    grid.innerHTML = "";

    for(let i=0;i<cols*rows;i++){

        const span = document.createElement("span");

        span.textContent =
        chars[Math.floor(Math.random()*chars.length)];

        grid.appendChild(span);
    }
}

buildGrid();
window.addEventListener("resize", buildGrid);

setInterval(()=>{

    const cells = grid.children;

    for(let i=0;i<2;i++){

        const c = cells[Math.floor(Math.random()*cells.length)];
        if(!c) return;

        c.style.opacity = 1;

        setTimeout(()=>{
            c.style.opacity = 0.25;
        },120);

    }

},20);

function isMobile(){
    return window.matchMedia("(max-width: 768px)").matches;
}

function removeImagesOnMobile(){

    if(!isMobile()) return;

    // remove all section images
    const images = document.querySelectorAll(".section .image");

    images.forEach(img => {
        img.remove();
    });

}

document.addEventListener("DOMContentLoaded", removeImagesOnMobile);

</script>

</body>
</html>
