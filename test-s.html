<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>d1_trainstation_01</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="images/censor.gif" type="image/gif">
  <link rel="stylesheet" href="csd.css">

  <div id="kill-feed"></div>
  <style>
    
@font-face {
  font-family: "HL2MP";
  src: url("Fonts/HL2MP.ttf") format("truetype");
}

@font-face {
  font-family: "DIN";
  src: url("Fonts/DIN\ 1451\ Mittelschrift\ Regular.ttf") format("truetype");
}

@font-face {
  font-family: "csd";
  src: url("Fonts/csd.ttf") format("truetype");
}

body {
  display: flex;
 justify-content: center;
 align-items: center;
 font-family: Bahnschrift, sans-serif;
 background: url("images/station\ it\ brother!.png") center / cover no-repeat fixed;
 color: rgb(255, 255, 255);
}

.center {
text-align: center;
}

#kill-feed {
  position: fixed;
  top: 18px;
  right: 18px;

  gap: 2px;
  display: flex;
  flex-direction: column;
  align-items: flex-end;

  pointer-events: none;
  z-index: 9999;
}

.title {
  font-family: DIN;
  font-size: 48px;
  letter-spacing: 2px;

  align-items: center;
}

.kill {
  display: flex;
  align-items: center;
  justify-content: flex-end;

  gap: 10px;
  margin: 0;

  font-size: 21px;
  white-space: nowrap;
  text-align: right;

  opacity: 0.9;
  transition: opacity 0.45s ease, transform 0.35s ease;
}

.kill.fade {
  opacity: 0;
  transform: translateX(14px);
}

.killer,
.victim {
  font-family: Bahnschrift, Helvetica, sans-serif;
  color: rgb(255, 255, 255);
}

.weapon {
  font-family: "HL2MP";
  font-size: 30px;

  margin: 0px;
  transform: translateY(5px);
  line-height: 1.5;
}

.headshot {
  font-family: "csd";
  font-size: 30px;

  margin-left: -0px;
  margin: 0px;
  transform: translateY(5px);
  line-height: 1.5;
}

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
}

</style>
</head>

<body>


  <div class="center">
    <p class="title">Don't tell me your on Mobile?</p>
    <p>If you are, I hope you can even read this, but..</p>
    <p>It won't work, I'm not putting the work in to make it work.</p>
    <p>If your on computer, it should all work very nicely!</p>
    <p>(excluding 4k)</p>
  <style>
    #text {
    color: #000000;
    animation: blinkingText 1.2s infinite;
  }

  @keyframes blinkingText {
    0% {
      color: #00000000;
    }

    49% {
      color: #ffffff42;
    }

    60% {
      color: white;
    }

    99% {
      color: white;
    }

    100% {
      color: #ffffff2d;
    }
  }
</style>

<h2><p id="text">Double click the screen</p></h2>
  </div>

<script src="assets/kill-feed.js"></script>
<script src="assets/stationscreen.js"></script>

</body>
</html>
