<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>d1_trainstation_01</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="images/censor.gif" type="image/gif">
  <link rel="stylesheet" href="csd.css">

  <div id="kill-feed"></div>
  <style>
    
@font-face {
  font-family: "HL2MP";
  src: url("Fonts/HL2MP.ttf") format("truetype");
}

@font-face {
  font-family: "csd";
  src: url("Fonts/csd.ttf") format("truetype");
}

body {
  display: flex;
 justify-content: center;
 align-items: center;
 font-family: Bahnschrift, sans-serif;
 background: url("images/backgroundstation3.png") center / cover no-repeat fixed;
 color: rgb(0, 0, 0);
}

.center {
text-align: center;
}

#kill-feed {
  position: fixed;
  top: 18px;
  right: 18px;
  width: 320px;
  pointer-events: none;
  z-index: 9999;
}

.kill {
  display: flex;
  align-items: right;
  gap: 9px;
  margin-bottom: 6px;

  font-size: 19px;
  white-space: nowrap;

  opacity: 0.9;
  transition: opacity 0.45s ease, transform 0.35s ease;
}

.kill.fade {
  opacity: 0;
  transform: translateX(14px);
}

.killer,
.victim {
  font-family: Bahnschrift, Helvetica, sans-serif;
  color: rgb(0, 0, 0);
}

.weapon {
  font-family: "HL2MP";
  font-size: 32px;
  line-height: -2;
}

.headshot {
  font-family: "csd";
  font-size: 32px;
  line-height: -2;
  margin-left: -0px;
}

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }
  </style>

</head>

<body>


  <div class="center">
    <h1>Don't tell me your on Mobile?</h1>
    <p>If you are, I hope you can even read this, but..</p>
    <p>It won't work, I'm not putting the work in to make it work.</p>
    <p>If your on computer, it should all work very nicely!</p>
    <p>(excluding 4k)</p>
  <style>
    #text {
    color: #000000;
    animation: blinkingText 1.2s infinite;
  }

  @keyframes blinkingText {
    0% {
      color: #000000;
    }

    49% {
      color: #000000;
    }

    60% {
      color: white;
    }

    99% {
      color: white;
    }

    100% {
      color: #000000;
    }
  }
</style>

<h3><p id="text">Double Click!</p></h3>
  </div>

<script src="assets/kill-feed.js"></script>
<script src="assets/stationscreen.js"></script>

</body>
</html>
