<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>404</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="images/gifs-icos/favicon.gif" type="image/gif">

    <style>

            :root {
      /* the arrow used after links.
         change this one line if arrow.svg lives somewhere else */
      --arrow: url("images/icos/arrow.svg");

      /* the arrow is used as a mask, so this colour is what you see
         (whatever colour the SVG file itself is doesn't matter) */
      --arrow-color: #ff4fa3;

      /* slow-in, slow-out: used by the arrow flip, the panel wipe and the header intro */
      --ease: cubic-bezier(0.35, 0.1, 0.65, 1);
    }

        @font-face {
            font-family: DIN;
            src: url("Fonts/DIN 1451 Mittelschrift Regular.ttf");
        }

        body {
            margin: 0;
            z-index: 999;
            overflow: hidden;
            background: #000;
            color: rgb(253, 224, 240);
            font-family: DIN, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* giant background text */

        .bg404 {
            position: absolute;
            inset: 0;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 40vw;
            font-weight: bold;
            letter-spacing: -2vw;

            color: #e2499b65;

            user-select: none;
            pointer-events: none;

            transition: filter 0.6s ease;
        }

        .content:hover~.bg404 {
            filter: blur(15px);
        }

        /* foreground content */

        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .content h1 {
            margin: 0;
            font-size: 2rem;
            letter-spacing: 0.2rem;
        }

        .content p {
            font-family: bahnschrift light;
            margin-top: 10px;
            font-size: 2rem;
        }

        .content a {
            transform: translateX(34.3%);
            font-family: bahnschrift light;
            margin-top: 25px;
            color: #ff4fa3;
            text-decoration: none;
            width: 140px;
            transition: 0.3s;
            align-items: center;
        }

    .content a::after {
      content: "";

      display: inline-block;

      width: 0.7em;
      height: 0.7em;

      margin-left: 0.3em;

      vertical-align: -0.09em;

      background-color: var(--arrow-color);
      -webkit-mask: var(--arrow) center / contain no-repeat;
      mask: var(--arrow) center / contain no-repeat;
      color: #ff4fa3;
      
    }

    main a:hover::after {
      transform: rotate(-90deg);
    }

    </style>
</head>

<body>

    <div class="content">
        <h1>THIS PAGE WASN'T FOUND.</h1>
        <h1>WHERE WERE YOU HEADED??</h1>

     <!-- <p>where were you headed?</p>--> 

        <a href="./">
            RETURN
        </a>

        <a href="">
            SITEMAP
        </a>
    </div>

    <div class="bg404">
        404*
    </div>

</body>

</html>
