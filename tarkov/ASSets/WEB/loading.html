        #logo-wrap {
            position: absolute;
            top: 14%;
            left: 50%;
            width: 46%;
            height: 30%;
            margin-left: -23%;
            text-align: center;
        }

        #logo {
            max-width: 100%;
            max-height: 100%;
        }

        #timer-wrap {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 14%;
            text-align: center;
        }

        #timer-label {
            font-size: 20px;
            letter-spacing: 1px;
            color: #b9b7a8;
            margin-bottom: 8px;
        }

        #timer-row {
            display: inline-block;
        }

        #timer-icon {
            display: inline-block;
            vertical-align: middle;
            position: relative;
            width: 36px;
            height: 36px;
            margin-right: 16px;
            border: 3px solid #b9b7a8;
            border-radius: 50%;
            opacity: 0.85;
        }

        #timer-icon:before,
        #timer-icon:after {
            content: "";
            position: absolute;
            background: #b9b7a8;
            left: 50%;
            top: 50%;
        }

        #timer-icon:before {
            width: 3px;
            height: 12px;
            margin-left: -1px;
            margin-top: -12px;
        }

        #timer-icon:after {
            width: 9px;
            height: 3px;
            margin-left: -1px;
            margin-top: -1px;
        }

        #timer {
            display: inline-block;
            vertical-align: middle;
            font-size: 50px;
            letter-spacing: 3px;
            color: #e6e3d3;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
        }

        #info {
            position: absolute;
            left: 16px;
            bottom: 12px;
            font-size: 13px;
            letter-spacing: 1px;
            color: rgba(200, 198, 180, 0.55);
        }

        #spinner {
            position: absolute;
            right: 30px;
            bottom: 28px;
            width: 26px;
            height: 26px;
            border: 3px solid rgba(215, 212, 195, 0.18);
            border-top-color: rgba(230, 227, 211, 0.95);
            border-radius: 50%;
            -webkit-animation: spin 0.9s linear infinite;
            animation: spin 0.9s linear infinite;
        }

        @-webkit-keyframes spin {
            from {
                -webkit-transform: rotate(0deg);
            }

            to {
                -webkit-transform: rotate(360deg);
            }
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

    <script>
        var start = new Date().getTime();
        var timerEl = document.getElementById("timer");

        function pad(n, len) {
            var s = String(n);
            while (s.length < len) s = "0" + s;
            return s;
        }

        setInterval(function () {
            var t = new Date().getTime() - start;
            var mins = Math.floor(t / 60000);
            var secs = Math.floor((t % 60000) / 1000);
            var ms = t % 1000;
            timerEl.innerHTML = pad(mins, 2) + ":" + pad(secs, 2) + "." + pad(ms, 3);
        }, 33);

        function GameDetails(servername, serverurl, mapname, maxplayers, steamid, gamemode) {
